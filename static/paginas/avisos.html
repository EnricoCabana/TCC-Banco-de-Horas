<!-- ================================================
     paginas/avisos.html
     Injetado em <main id="content"> pelo main.js.
     NÃO contém <html>, <head>, <body>.
     O main.js chama iniciarModuloAvisos() após injetar.
================================================ -->

<div class="page-header">
  <div>
    <h1>Avisos</h1>
    <p>Comunicados e informações para os colaboradores</p>
  </div>
</div>

<!-- ── FORMULÁRIO ─────────────────────────────────────────── -->
<div class="card av-form-card" id="cardFormAviso" style="display:none; margin-bottom:24px;">

  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;">
    <h2 class="av-form-title">
      <i class="fa-solid fa-bullhorn" style="color:var(--brand); margin-right:8px;"></i>
      Novo Aviso
    </h2>
    <button class="btn-secondary av-btn-sm" id="btnCancelarAviso">
      <i class="fa-solid fa-xmark"></i> Cancelar
    </button>
  </div>

  <div class="av-form-grid">

    <div class="av-form-group" style="grid-column: 1 / -1;">
      <label class="av-form-label">Título <span class="av-obrig">*</span></label>
      <input type="text" id="avTitulo" class="av-input" maxlength="200"
             placeholder="Ex: Reunião geral na próxima segunda-feira" autocomplete="off" />
    </div>

    <div class="av-form-group" style="grid-column: 1 / -1;">
      <label class="av-form-label">Mensagem <span class="av-obrig">*</span></label>
      <textarea id="avMensagem" class="av-input av-textarea" rows="4" maxlength="2000"
        placeholder="Descreva o aviso com todos os detalhes necessários..."></textarea>
    </div>

    <div class="av-form-group">
      <label class="av-form-label">Tipo de Aviso <span class="av-obrig">*</span></label>
      <div class="av-tipo-grid" id="avTipoGrid">
        <button type="button" class="av-tipo-btn active" data-tipo="geral">
          <span class="av-tipo-icon"><i class="fa-solid fa-bullhorn"></i></span><span>Geral</span>
        </button>
        <button type="button" class="av-tipo-btn" data-tipo="importante">
          <span class="av-tipo-icon"><i class="fa-solid fa-triangle-exclamation"></i></span><span>Importante</span>
        </button>
        <button type="button" class="av-tipo-btn" data-tipo="comemorativo">
          <span class="av-tipo-icon"><i class="fa-solid fa-champagne-glasses"></i></span><span>Comemorativo</span>
        </button>
      </div>
    </div>

  </div>

  <div id="avFormErro" class="av-form-erro" style="display:none;">
    <i class="fa-solid fa-circle-exclamation"></i>
    <span id="avFormErroMsg">Erro ao salvar aviso.</span>
  </div>

  <div style="display:flex; justify-content:flex-end; margin-top:20px;">
    <button class="btn-primary" id="btnSalvarAviso">
      <i class="fa-solid fa-paper-plane"></i> Publicar Aviso
    </button>
  </div>

</div>

<!-- ── FILTROS ───────────────────────────────────────────── -->
<div class="card" style="margin-bottom:20px;">
  <div class="av-section-label">Filtros</div>
  <div class="av-filtros-row">

    <!-- Tipo -->
    <div class="av-filtro-group">
      <label class="av-filtro-label">Tipo</label>
      <div class="av-chips" id="filtroTipoChips">
        <button class="av-chip active" data-tipo="todos">Todos</button>
        <button class="av-chip" data-tipo="geral">
          <i class="fa-solid fa-bullhorn"></i> Geral
        </button>
        <button class="av-chip" data-tipo="importante">
          <i class="fa-solid fa-triangle-exclamation"></i> Importante
        </button>
        <button class="av-chip" data-tipo="comemorativo">
          <i class="fa-solid fa-champagne-glasses"></i> Comemorativo
        </button>
      </div>
    </div>

    <!-- Período — inclui "Programados" -->
    <div class="av-filtro-group">
      <label class="av-filtro-label">Período</label>
      <div class="av-chips" id="filtroPeriodoChips">
        <button class="av-chip active" data-periodo="hoje">Hoje</button>
        <button class="av-chip" data-periodo="semana">Esta semana</button>
        <button class="av-chip" data-periodo="todos">Todos</button>
      </div>
    </div>
    <!-- Data específica -->
    <div class="av-filtro-group">
      <label class="av-filtro-label">Data específica</label>
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="date" id="filtroDataEspecifica" class="av-input av-input-sm" />
        <button class="btn-secondary av-btn-sm" id="btnFiltrarData">Buscar</button>
        <button class="btn-secondary av-btn-sm" id="btnLimparData" style="display:none;">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <button class="btn-primary" id="btnAbrirFormAviso" style="margin-left:auto; align-self:flex-end;">
      <i class="fa-solid fa-plus"></i> Novo Aviso
    </button>

  </div>
</div>

<!-- ── LISTAGEM ──────────────────────────────────────────── -->
<div id="avResumoTopo" class="av-resumo-topo" style="display:none;"></div>

<div id="avListagem">
  <div class="av-loading">
    <i class="fa-solid fa-circle-notch fa-spin"></i>
    <p>Carregando avisos...</p>
  </div>
</div>

<!-- ── ESTILOS DO MÓDULO ─────────────────────────────────── -->
<style>
  /* ── Formulário ─── */
  .av-form-title  { font-size:16px; font-weight:600; color:var(--text); display:flex; align-items:center; }
  .av-btn-sm      { padding:6px 14px; font-size:13px; }
  .av-form-dica   { font-size:11px; font-weight:400; color:var(--muted-2); margin-left:6px; background:var(--surface-3); padding:1px 7px; border-radius: 0; }
  .av-hint        { font-size:12px; color:var(--muted-2); margin-top:4px; line-height:1.5; }
  .av-hint i      { color:var(--brand); margin-right:3px; }
  .av-form-grid   { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:16px; align-items:start; }
  .av-form-group  { display:flex; flex-direction:column; gap:6px; }
  .av-form-label  { font-size:13px; font-weight:500; color:var(--text-soft); }
  .av-obrig       { color:#ef4444; }
  .av-input {
    padding:9px 12px; border:1px solid var(--border-strong); border-radius: 0;
    font-size:14px; color:var(--text); background:var(--surface); width:100%;
    transition:border-color .15s, box-shadow .15s; font-family:inherit;
  }
  .av-input:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(59,130,246,.15); }
  .av-textarea    { resize:vertical; min-height:96px; }
  .av-input-sm    { width:160px; }
  .av-form-erro {
    display:flex; align-items:center; gap:8px;
    background:var(--tint-red); border:1px solid var(--tint-red);
    border-radius: 0; padding:10px 14px;
    color:var(--fg-red); font-size:13px; margin-top:12px;
  }

  /* ── Tipo de aviso (formulário) ─── */
  .av-tipo-grid { display:flex; gap:10px; flex-wrap:wrap; }
  .av-tipo-btn {
    display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:10px 20px; border:2px solid var(--border); border-radius: 0;
    background:var(--surface); cursor:pointer; font-size:13px; font-weight:500;
    color:var(--muted); transition:all .15s; font-family:inherit;
  }
  .av-tipo-btn .av-tipo-icon { font-size:20px; }
  .av-tipo-btn:hover  { border-color:var(--brand); color:var(--brand); background:var(--tint-blue); }
  .av-tipo-btn.active { border-color:var(--brand); color:var(--fg-blue); background:var(--tint-blue); font-weight:600; }

  /* ── Filtros ─── */
  .av-section-label  { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.8px; color:var(--brand); margin-bottom:16px; padding-bottom:8px; border-bottom:1px solid var(--border); }
  .av-filtros-row    { display:flex; gap:28px; flex-wrap:wrap; align-items:flex-start; }
  .av-filtro-group   { display:flex; flex-direction:column; gap:8px; }
  .av-filtro-label   { font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .av-chips          { display:flex; gap:6px; flex-wrap:wrap; }
  .av-chip {
    padding:5px 14px; border:1px solid var(--border); border-radius: 0;
    background:var(--surface); font-size:13px; color:var(--muted); cursor:pointer;
    font-family:inherit; transition:all .15s; display:flex; align-items:center; gap:5px;
  }
  .av-chip:hover  { border-color:var(--brand); color:var(--brand); }
  .av-chip.active { background:var(--brand); border-color:var(--brand); color:#fff; font-weight:600; }

  /* ── Resumo topo ─── */
  .av-resumo-topo { font-size:13px; color:var(--muted); margin-bottom:12px; padding:0 2px; }

  /* ── Cards de aviso ─── */
  .av-lista   { display:flex; flex-direction:column; gap:14px; }
  .av-card {
    background:var(--surface); border:1px solid var(--border); border-radius: 0;
    padding:18px 20px; display:flex; gap:16px; align-items:flex-start;
    transition:box-shadow .15s;
  }
  .av-card:hover { box-shadow:0 4px 16px rgba(0,0,0,.07); }

  /* Borda lateral colorida por tipo */
  .av-card.tipo-geral        { border-left:4px solid var(--brand); }
  .av-card.tipo-importante   { border-left:4px solid #f59e0b; }
  .av-card.tipo-comemorativo { border-left:4px solid #10b981; }

  /* Aviso programado: borda roxa tracejada */
  .av-card-prog { border-left:4px dashed var(--muted-2) !important; background:var(--surface-2); }

  .av-card-icon {
    width:40px; height:40px; border-radius: 0;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; flex-shrink:0;
  }
  .tipo-geral .av-card-icon        { background:var(--tint-blue); color:var(--brand); }
  .tipo-importante .av-card-icon   { background:var(--tint-amber); color:#f59e0b; }
  .tipo-comemorativo .av-card-icon { background:var(--tint-green); color:#10b981; }
  .av-card-prog .av-card-icon      { background:var(--surface-3); color:var(--muted); }

  .av-card-body   { flex:1; min-width:0; }
  .av-card-header {
    display:flex; align-items:flex-start;
    justify-content:space-between; gap:12px; margin-bottom:6px;
  }
  .av-card-titulo { font-size:15px; font-weight:600; color:var(--text); line-height:1.35; min-width:0; overflow-wrap:anywhere; word-break:break-word; }
  .av-card-meta   {
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    font-size:12px; color:var(--muted-2); flex-shrink:0;
  }
  .av-card-badge {
    padding:2px 10px; border-radius: 0;
    font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.5px;
  }
  .badge-geral        { background:var(--tint-blue); color:var(--fg-blue); }
  .badge-importante   { background:var(--tint-amber); color:var(--fg-amber); }
  .badge-comemorativo { background:var(--tint-green); color:var(--fg-green); }
  /* Selo "Novo" — cor quente, chama atenção nos avisos não vistos */
  .av-card-badge.badge-novo {
    background:#b45309; color:#fff; border:none;
    display:inline-flex; align-items:center; gap:5px;
  }

  /* Badge "Publicação agendada para dd/mm/aaaa" */
  .av-badge-prog {
    display:inline-flex; align-items:center; gap:8px;
    background:var(--surface-3); border:1px solid var(--border-strong);
    color:var(--text-soft); border-radius: 0;
    font-size:13px; font-weight:500;
    padding:7px 14px; margin:8px 0;
    width:fit-content;
  }
  .av-badge-prog i    { font-size:13px; flex-shrink:0; }
  .av-badge-prog strong { font-weight:700; }

  .av-card-msg    { font-size:14px; color:var(--text-soft); line-height:1.6; overflow-wrap:anywhere; word-break:break-word; }
  .av-card-footer {
    display:flex; align-items:center; justify-content:space-between;
    margin-top:12px; padding-top:10px; border-top:1px solid var(--surface-3);
  }
  .av-card-autor  { font-size:12px; color:var(--muted-2); display:flex; align-items:center; gap:6px; }
  .av-card-acoes  { display:flex; gap:6px; }
  .av-btn-acao {
    width:30px; height:30px; border:1px solid var(--border);
    border-radius: 0; background:var(--surface); cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:12px; color:var(--muted); transition:all .15s;
  }
  .av-btn-acao.excluir:hover { background:var(--tint-red); border-color:#ef4444; color:#ef4444; }

  /* ── Empty / Loading ─── */
  .av-empty {
    text-align:center; padding:64px 20px;
    background:var(--surface); border:1px solid var(--border);
    border-radius: 0; color:var(--muted-2);
  }
  .av-empty-icon { font-size:40px; margin-bottom:14px; display:block; }
  .av-empty h3   { font-size:15px; font-weight:600; color:var(--text-soft); margin-bottom:6px; }
  .av-empty p    { font-size:13px; }
  .av-loading {
    text-align:center; padding:60px 20px; color:var(--muted-2); font-size:14px;
    display:flex; flex-direction:column; align-items:center; gap:12px;
  }
  .av-loading i { font-size:28px; color:var(--border-strong); }

  /* ── Destinatários (aviso privado) ─── */
  .av-dest-box   { border:1px solid var(--border-strong); border-radius: 0; overflow:hidden; }
  .av-dest-busca-wrap { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--surface-3); background:var(--surface); }
  .av-dest-busca-wrap i { color:var(--muted-2); font-size:13px; }
  .av-dest-busca { flex:1; border:none; outline:none; background:transparent; font-size:14px; color:var(--text); font-family:inherit; }
  .av-dest-lista { max-height:220px; overflow-y:auto; }
  .av-dest-item {
    display:flex; align-items:center; gap:10px; padding:9px 14px;
    font-size:14px; color:var(--text); cursor:pointer; border-top:1px solid var(--surface-3);
  }
  .av-dest-item:hover  { background:var(--surface-2); }
  .av-dest-item input  { width:16px; height:16px; cursor:pointer; accent-color:var(--brand); }
  .av-dest-todos       { background:var(--surface-2); border-top:none; }
  .av-dest-carregando, .av-dest-vazio { padding:14px; font-size:13px; color:var(--muted-2); text-align:center; }

  /* ── Divisão Público / Privado na listagem ─── */
  .av-secao-titulo {
    display:flex; align-items:center; gap:8px;
    font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.6px;
    color:var(--muted); margin:22px 2px 12px;
  }
  .av-secao-titulo:first-child  { margin-top:4px; }
  .av-secao-titulo .av-secao-cont { font-weight:600; color:var(--muted-2); }
  .av-secao-titulo i { color:var(--brand); }

  /* Selo "Privado" + linha "para quem" */
  .badge-privado { background:var(--tint-purple); color:var(--fg-purple); display:inline-flex; align-items:center; gap:5px; }
  .av-card-para  { font-size:12px; color:var(--muted-2); margin-top:8px; display:flex; align-items:flex-start; gap:6px; }
  .av-card-para i { margin-top:2px; color:var(--fg-purple); }
</style>
