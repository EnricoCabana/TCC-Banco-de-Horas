<!-- ================================================
     paginas/auditoria.html
     Injetado em <main id="content"> pelo main.js.
     main.js chama iniciarModuloAuditoria() após injetar.
================================================ -->

<div class="page-header">
  <div>
    <h1>Auditoria</h1>
    <p>Registro de tudo que foi criado, editado ou excluído — por quem e quando</p>
  </div>
</div>

<!-- ── FILTROS ────────────────────────────────── -->
<div class="card" style="margin-bottom:20px;">
  <div class="aud-section-label">Filtros</div>
  <div class="aud-filtros">
    <div class="aud-group">
      <label>Ação</label>
      <select id="audAcao" class="form-input">
        <option value="">Todas</option>
        <option value="CRIAR">Criação</option>
        <option value="EDITAR">Edição</option>
        <option value="EXCLUIR">Exclusão</option>
      </select>
    </div>
    <div class="aud-group">
      <label>Entidade</label>
      <select id="audEntidade" class="form-input"><option value="">Todas</option></select>
    </div>
    <div class="aud-group">
      <label>Quem fez</label>
      <select id="audExecutor" class="form-input"><option value="">Todos</option></select>
    </div>
    <div class="aud-group">
      <label>De</label>
      <input type="date" id="audDataDe" class="form-input" />
    </div>
    <div class="aud-group">
      <label>Até</label>
      <input type="date" id="audDataAte" class="form-input" />
    </div>
    <div class="aud-group aud-busca">
      <label>Busca</label>
      <input type="text" id="audBusca" class="form-input" placeholder="Texto na descrição, matrícula, nome..." autocomplete="off" />
    </div>
    <div class="aud-group aud-acoes">
      <button class="btn-primary" id="btnAudFiltrar"><i class="fa-solid fa-magnifying-glass"></i> Filtrar</button>
      <button class="aud-btn-limpar" id="btnAudLimpar">Limpar</button>
    </div>
  </div>
</div>

<!-- ── LISTA ──────────────────────────────────── -->
<div class="card">
  <div class="aud-toolbar">
    <strong>Eventos</strong>
    <span id="audTotal" style="font-size:13px;color:var(--muted-2);"></span>
  </div>

  <div style="overflow-x:auto;">
    <table id="tabelaAuditoria">
      <thead>
        <tr>
          <th>Data / Hora</th>
          <th>Ação</th>
          <th>Entidade</th>
          <th>Descrição</th>
          <th>Quem fez</th>
        </tr>
      </thead>
      <tbody id="corpoAuditoria">
        <tr><td colspan="5" class="aud-carregando"><i class="fa-solid fa-circle-notch fa-spin"></i><p>Carregando...</p></td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- ── ESTILOS LOCAIS ─────────────────────────── -->
<style>
  .aud-section-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.8px; color:var(--brand); margin-bottom:14px; padding-bottom:8px; border-bottom:1px solid var(--border); }
  .aud-filtros { display:grid; grid-template-columns:repeat(6, 1fr); gap:12px; align-items:end; }
  .aud-group { display:flex; flex-direction:column; }
  .aud-group label { font-size:12px; font-weight:500; color:var(--text-soft); margin-bottom:6px; }
  .aud-busca { grid-column:span 4; }
  .aud-acoes { grid-column:span 2; flex-direction:row; gap:8px; align-items:center; }
  .aud-acoes .btn-primary { height:42px; }
  .aud-btn-limpar { height:42px; padding:0 14px; border:1px solid var(--border-strong); background:var(--surface); color:var(--muted); border-radius: 0; cursor:pointer; font-size:13px; }
  .aud-btn-limpar:hover { background:var(--surface-2); }

  .aud-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }

  #tabelaAuditoria { width:100%; border-collapse:collapse; font-size:14px; }
  #tabelaAuditoria thead th { text-align:left; padding:10px 14px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); border-bottom:2px solid var(--surface-3); background:var(--surface-2); white-space:nowrap; }
  #tabelaAuditoria tbody tr { border-bottom:1px solid var(--surface-3); }
  #tabelaAuditoria tbody tr:hover { background:var(--surface-2); }
  #tabelaAuditoria tbody td { padding:12px 14px; color:var(--text-soft); vertical-align:top; }
  .aud-data { font-family:'Courier New',monospace; font-size:13px; color:var(--muted); white-space:nowrap; }
  .aud-badge { font-size:11px; font-weight:700; padding:3px 9px; border-radius: 0; white-space:nowrap; }
  .aud-badge-criar   { background:var(--tint-green); color:var(--fg-green); }
  .aud-badge-editar  { background:var(--tint-blue); color:var(--fg-blue); }
  .aud-badge-excluir { background:var(--tint-red); color:var(--fg-red); }
  .aud-entidade { font-weight:600; color:var(--text); }
  .aud-quem { color:var(--muted); white-space:nowrap; }
  .aud-carregando, .aud-vazia { text-align:center; padding:48px 20px !important; color:var(--muted-2); }
  .aud-carregando i, .aud-vazia i { font-size:30px; display:block; margin-bottom:10px; color:var(--border-strong); }

  @media (max-width:820px) {
    .aud-filtros { grid-template-columns:1fr 1fr; }
    .aud-busca, .aud-acoes { grid-column:span 2; }
  }
</style>
