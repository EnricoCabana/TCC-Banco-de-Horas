<!-- ================================================
     paginas/solicitacoes.html
     Injetado em <main id="content"> pelo main.js.
     main.js chama iniciarModuloSolicitacoes() após injetar.
================================================ -->

<div class="page-header">
  <div>
    <h1>Solicitações</h1>
    <p>Pedidos de ajuste de ponto — pendentes, aprovados e negados</p>
  </div>
</div>

<!-- ── NOVA SOLICITAÇÃO (qualquer usuário logado) ─────────────── -->
<div class="card sol-form-card" style="margin-bottom:20px;">
  <div class="sol-section-label">Nova Solicitação</div>

  <div class="sol-form-grid">
    <div class="sol-form-group">
      <label class="sol-form-label">Data <span class="sol-obrig">*</span></label>
      <input type="date" id="solData" class="form-input" />
    </div>

    <div class="sol-form-group">
      <label class="sol-form-label">Tipo (ocorrência) <span class="sol-obrig">*</span></label>
      <select id="solOcorrencia" class="form-input">
        <option value="Normal">Normal</option>
        <option value="Falta Injustificada">Falta Injustificada</option>
        <option value="Falta Justificada">Falta Justificada</option>
        <option value="Atestado">Atestado</option>
        <option value="Folga">Folga</option>
        <option value="Férias">Férias</option>
        <option value="Treinamento">Treinamento</option>
        <option value="Licença Nojo/Luto">Licença Nojo/Luto</option>
      </select>
    </div>

    <div class="sol-form-group" style="grid-column:1 / -1;">
      <label class="sol-form-label">Mensagem <span class="sol-obrig">*</span></label>
      <textarea id="solMensagem" class="form-input sol-textarea" rows="3" maxlength="255"
        placeholder="Explique o motivo do ajuste (ex: esqueci de bater o ponto de saída)"></textarea>
    </div>
  </div>

  <div id="solFormErro" class="sol-form-erro" style="display:none;">
    <i class="fa-solid fa-circle-exclamation"></i>
    <span id="solFormErroMsg">Erro ao enviar solicitação.</span>
  </div>

  <div style="display:flex; justify-content:flex-end; margin-top:16px;">
    <button class="btn-primary" id="btnEnviarSolicitacao">
      <i class="fa-solid fa-paper-plane"></i> Enviar Solicitação
    </button>
  </div>
</div>

<!-- ── LISTA ───────────────────────────────────────────────────── -->
<div class="card">

  <!-- Abas Pendente / Aprovado / Negado -->
  <div class="segmento sol-tabs" id="solTabs">
    <button class="active" data-status="Pendente">Pendentes</button>
    <button data-status="Aprovado">Aprovados</button>
    <button data-status="Negado">Negados</button>
  </div>

  <div style="overflow-x:auto; margin-top:16px;">
    <table id="tabelaSolicitacoes">
      <thead>
        <tr>
          <th>Data</th>
          <th class="sol-col-admin">Funcionário</th>
          <th>Tipo</th>
          <th>Mensagem</th>
          <th>Solicitado em</th>
          <th>Respondido por</th>
          <th class="sol-col-admin">Ação</th>
        </tr>
      </thead>
      <tbody id="corpoSolicitacoes">
        <tr><td colspan="7" class="sol-carregando"><i class="fa-solid fa-circle-notch fa-spin"></i><p>Carregando...</p></td></tr>
      </tbody>
    </table>
  </div>

</div>

<!-- ── ESTILOS LOCAIS ─────────────────────────────────────────── -->
<style>
  .sol-section-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.8px; color:var(--brand); margin-bottom:16px; padding-bottom:8px; border-bottom:1px solid var(--border); }

  .sol-form-grid  { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px; align-items:start; }
  .sol-form-group { display:flex; flex-direction:column; gap:6px; }
  .sol-form-label { font-size:13px; font-weight:500; color:var(--text-soft); }
  .sol-obrig      { color:#ef4444; }
  .sol-textarea   { resize:vertical; min-height:72px; font-family:inherit; }
  .sol-form-erro {
    display:flex; align-items:center; gap:8px;
    background:var(--tint-red); border:1px solid var(--tint-red);
    color:var(--fg-red); font-size:13px; padding:10px 14px; margin-top:12px;
  }

  /* Abas reaproveitam o .segmento já usado no Perfil */
  .sol-tabs { display:inline-flex; }

  #tabelaSolicitacoes { width:100%; border-collapse:collapse; font-size:14px; }
  #tabelaSolicitacoes thead th { text-align:left; padding:10px 14px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); border-bottom:2px solid var(--surface-3); background:var(--surface-2); white-space:nowrap; }
  #tabelaSolicitacoes tbody tr { border-bottom:1px solid var(--surface-3); }
  #tabelaSolicitacoes tbody tr:hover { background:var(--surface-2); }
  #tabelaSolicitacoes tbody td { padding:12px 14px; color:var(--text-soft); vertical-align:top; }

  .sol-data     { font-family:'Courier New',monospace; font-size:13px; color:var(--muted); white-space:nowrap; }
  .sol-msg      { max-width:320px; overflow-wrap:anywhere; }
  .sol-quem     { color:var(--muted); white-space:nowrap; }

  .sol-acoes { display:flex; gap:6px; }
  .sol-btn-aprovar, .sol-btn-negar {
    border:none; border-radius: 0; padding:6px 12px; font-size:12px; font-weight:600;
    cursor:pointer; white-space:nowrap;
  }
  .sol-btn-aprovar { background:var(--tint-green); color:var(--fg-green); }
  .sol-btn-aprovar:hover { background:#bbf7d0; }
  .sol-btn-negar   { background:var(--tint-red); color:var(--fg-red); margin-left:6px; }
  .sol-btn-negar:hover { background:#fecaca; }

  .sol-carregando, .sol-vazia { text-align:center; padding:48px 20px !important; color:var(--muted-2); }
  .sol-carregando i, .sol-vazia i { font-size:30px; display:block; margin-bottom:10px; color:var(--border-strong); }

  /* A coluna "Funcionário" e "Ação" só fazem sentido pro RH — main.js
     esconde/mostra .sol-col-admin diretamente via JS (iniciarModuloSolicitacoes). */
  .sol-col-admin.sol-oculta { display:none; }

  @media (max-width:820px) {
    .sol-msg { max-width:180px; }
  }
</style>
